<app-header></app-header>
<div class="page">
  <mat-card class="card view-card">
    <div class="view-header">
      <h1 class="card-title">Forecast Results</h1>
      <button mat-stroked-button color="primary" (click)="reloadPage()">Refresh</button>
    </div>

    <img [src]="plotUrl" class="forecast-image" alt="Forecast chart">

    <div class="metrics">
      <div class="metric-tile">
        <span class="metric-label">Model</span>
        <span class="metric-value">{{results?.error?.MODEL || '—'}}</span>
      </div>
      <div class="metric-tile">
        <span class="metric-label">MAE</span>
        <span class="metric-value">{{results?.error?.MAE | number:'1.0-2'}}</span>
      </div>
      <div class="metric-tile">
        <span class="metric-label">MSE</span>
        <span class="metric-value">{{results?.error?.MSE | number:'1.0-2'}}</span>
      </div>
      <div class="metric-tile">
        <span class="metric-label">RMSE</span>
        <span class="metric-value">{{results?.error?.RMSE | number:'1.0-2'}}</span>
      </div>
      <div class="metric-tile">
        <span class="metric-label">MAPE</span>
        <span class="metric-value">{{results?.error?.MAPE | number:'1.0-2'}}%</span>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="MyChart"></canvas>
    </div>
  </mat-card>
</div>
