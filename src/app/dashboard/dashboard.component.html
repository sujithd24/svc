<app-header></app-header>
<div class="page">
  <mat-card class="card">
    <h1 class="card-title">Sales Forecast</h1>
    <p class="card-subtitle">Upload a sales CSV or use the sample dataset, then choose how many months to forecast.</p>

    <form [formGroup]="getform" (ngSubmit)="onSubmit()" class="form">
      <div class="upload-row">
        <input type="file" id="file-input" class="file-input" accept=".csv" [disabled]="isLoading" (change)="getFile($event)">
        <label for="file-input" class="file-label">Choose CSV File</label>
        <button type="button" mat-stroked-button color="primary" [disabled]="isLoading" (click)="useSampleData()">Use Sample Data</button>
      </div>
      <div *ngIf="fileName" class="filename">Selected: {{fileName}}</div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Months to forecast</mat-label>
        <input matInput placeholder="e.g. 12" formControlName="future">
        <mat-error *ngIf="future && future.invalid && future.touched">Prediction time is required</mat-error>
      </mat-form-field>

      <div class="loading-row" *ngIf="isLoading">
        <mat-spinner diameter="22"></mat-spinner>
        <span class="loading-text">{{loadingMessage}}</span>
      </div>

      <div class="actions">
        <button [disabled]="getform.invalid || isLoading" mat-raised-button color="primary" type="submit">Run Forecast</button>
        <button [disabled]="!res_status" mat-stroked-button color="primary" type="button" (click)="forecast()">View Results</button>
      </div>
    </form>
  </mat-card>
</div>
